<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>임기창 자기소개서</title>
  <style>
    :root {
      --bg: #F2F2F0;
      --page: #FFFFFF;
      --t1: #0F0F0F;
      --t2: #4B5563;
      --t3: #9CA3AF;
      --accent: #3730A3;
      --accent-tint: #EEF2FF;
      --border: #E5E7EB;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--t1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
      font-size: 13.5px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 800px;
      margin: 40px auto;
      background: var(--page);
      border-radius: 4px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .header { padding: 44px 52px 36px; border-bottom: 1px solid var(--border); }
    .name { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .doc-type { margin-top: 6px; font-size: 0.95rem; color: var(--t2); }
    .body { padding: 0 52px 52px; }
    .section { padding-top: 36px; }
    .section-label {
      font-size: 11px; font-weight: 800;
      color: var(--t1);
      border-bottom: 1.5px solid var(--t1);
      padding-bottom: 6px;
      margin-bottom: 16px;
      letter-spacing: 0.01em;
    }
    .section-title { font-size: 15px; font-weight: 800; color: var(--t1); margin-bottom: 12px; }
    .prose { font-size: 13px; color: var(--t2); line-height: 1.85; }
    .prose strong { color: var(--t1); font-weight: 600; }
    .prose p + p { margin-top: 10px; }
    .prose .subhead {
      font-weight: 700; color: var(--accent); font-size: 13px;
      margin: 22px 0 7px; letter-spacing: -0.01em;
      padding-left: 11px; position: relative;
    }
    .prose .subhead::before {
      content: ''; position: absolute; left: 0; top: 3px; bottom: 3px;
      width: 3px; border-radius: 2px; background: var(--accent);
    }
    .prose .subhead:first-child { margin-top: 0; }
    /* 좌우는 이력서·경력기술서와 동일한 14mm. 상하만 10mm로 둬서 본문을
       13px 그대로 유지한 채 A4 한 장에 담는다. */
    @page { size: A4; margin: 10mm 14mm; }
    @media print {
      html, body { background: #fff; }
      body {
        /* 이력서·경력기술서와 같은 13px로 맞춰 문서 세트의 밀도를 통일 */
        font-size: 13px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .page { margin: 0; border: none; border-radius: 0; box-shadow: none; max-width: 100%; overflow: visible; }
      .header { padding: 0 0 14px; }
      .body { padding: 0; }
      .section { padding-top: 16px; }
      .prose { font-size: 13px; line-height: 1.78; }
      .prose p + p { margin-top: 8px; }
      .prose .subhead { margin: 16px 0 6px; }
      .section-label, .section-title, .prose .subhead { break-after: avoid; }
      /* 문단은 갈라져도 되게 둔다. avoid를 걸면 두세 줄짜리 문단 하나 때문에
         페이지가 통째로 넘어가 마지막 장이 거의 비어버린다. */
      .prose p { orphans: 2; widows: 2; }
    }
  </style>
</head>
<body>
<script>
/* ================================================================
   ▼▼▼  이직 시 이 데이터만 수정하세요  ▼▼▼
   ================================================================ */
const DATA = {
  name: "임기창",
  docType: "자기소개서",
  sections: [
    {
      id: "core",
      label: "Section 01",
      title: "개발자가 된 계기와 지향점",
      paragraphs: [
        { text: `세무 실무를 하다 보면 반복되는 수작업이 많았는데, 이런 일을 조금 더 편하게 만들 방법이 없을까 궁금해지곤 했습니다. 그 궁금증이 개발로 이어졌고, 지금도 더 나은 방법을 찾아보는 과정 자체에 재미를 느낍니다.` },
        { text: `실무 3년 차인 지금은 멀티에이전트 RAG 챗봇 플랫폼 <strong>Argos AI Chat Search</strong>에서 백엔드 도메인 API와 AI 파이프라인, 관리자 대시보드를 맡고 있습니다. 기능을 빨리 늘리기보다 한정된 자원을 아껴 쓰고 오래 안정적으로 쓰이는 결과물을 만드는 쪽을 더 좋아합니다. 불필요한 LLM 호출을 줄여 응답과 비용을 낮춘 것도 그런 생각에서 나온 선택이었습니다.` },
        { text: `이 플랫폼은 개발을 이어오며 <strong>GS SW 1등급 인증</strong>과 공공기관 납품이라는 성과를 거뒀습니다. 동시에 검색 엔진 <strong>ArgosSearch</strong>를 운영하며 고객사에서 생기는 문제도 직접 해결하고 있습니다. 매일 서버를 재기동시키던 색인 작업을 요청 단위로 잘게 나눠, 성능은 그대로 둔 채 안정성만 되찾은 일이 그런 예입니다.` },
      ],
    },
    {
      id: "approach",
      label: "Section 02",
      title: "문제를 대하는 방식",
      paragraphs: [
        { text: `기능 하나를 만들 때도 시스템 전체에 미치는 영향을 살피고, 정상 흐름 이면의 실패 경로까지 짚어 위험을 미리 줄이려 합니다. 또 문제를 혼자 안고 있기보다 동료들과 코드를 함께 보며 풀어가는 편입니다.` },
        { subhead: `데이터 영구 유실을 막은 선제적 코드 리뷰`, text: `현재 담당 중인 <strong>Argos AI Chat Search</strong>에서 외부 DB에 등록된 문서의 재임베딩 로직을 코드 리뷰할 때의 일입니다. 코드는 '기존 벡터 삭제 후 새 임베딩 생성' 순서였고, 정상 동작에는 문제가 없어 보였습니다. 다만 리뷰 중에 "외부 API 호출이나 저장이 중간에 한 번이라도 실패하면, 이미 지운 데이터는 어떻게 되지?"라는 의문이 들었습니다.` },
        { text: `실패 경로를 동료와 함께 따라가 보니, 재생성이 중간에 멈추면 원본 문서가 복구할 수 없이 사라지는 구조였습니다. 그래서 '재생성 성공을 먼저 확인한 뒤 기존 벡터를 삭제'하도록 순서를 뒤집자고 제안했고, 덕분에 재임베딩이 실패해도 기존 데이터는 그대로 남게 됐습니다.` },
        { text: `혼자였다면 정상 흐름만 보고 지나쳤을 문제였는데, 함께 들여다본 덕분에 미리 잡을 수 있었습니다. 그 뒤로 코드를 볼 때면 정상 동작만큼이나 '실패했을 때 어떻게 되는가'를 먼저 고민하려 노력합니다.` },
      ],
    },
  ],
  /* 지원 동기 — 지원하는 회사가 정해지면 paragraphs에 문단을 채우세요.
     비어 있으면 이 섹션은 렌더링되지 않습니다. (코드 수정 불필요)
     작성 가이드와 초안은 이 DATA 블록 아래 주석을 참고하세요. */
  motivation: {
    label: "Section 03",
    title: "지원 동기",
    paragraphs: [],
  },
};
/* ================================================================
   지원 동기 작성 참고 — 렌더링되지 않는 메모

   ── 회사 유형별로 앞세울 경험 ──────────────────────────────
   AI 스타트업        Qdrant·RAG 파이프라인, GS 인증까지의 전체 과정
   검색 솔루션        Elasticsearch 운영·장애 진단, 색인 스케줄러·커넥션 풀
                     트러블슈팅, Tika 파싱 성능 개선(메모리 74%↓·3.2배)
   공공 SI / 중견     전자정부프레임워크, 공공기관 납품 대응, 문서화·유지보수
   일반 백엔드        Spring Boot, JPA, API 설계, Docker, 대용량 데이터 처리
   프론트 겸업 포지션  Next.js 관리자 대시보드 + FastAPI, SSE 스트리밍

   ── 뼈대 ────────────────────────────────────────────────
   [회사명]의 [제품·도메인]에 관심을 갖게 된 것은 [구체적 이유]입니다.
   저는 웨어비즈에서 멀티에이전트 RAG 챗봇 플랫폼을 초기 멤버로 개발하며
   GS SW 1등급 인증 취득까지 경험했습니다.
   이 과정에서 [회사 제품·도메인과 연결되는 내 경험을 구체적으로].
   [회사명]에서 [기여하고 싶은 것]을 통해 [성장 방향]을 이루고 싶습니다.

   ── 초안 (AI 스타트업 기준) ──────────────────────────────
   [회사명]의 AI 검색·대화형 서비스에 관심을 갖게 된 것은, 정확성과 신뢰도가
   생명인 도메인에서 실제 운영 가능한 수준의 안정성을 만들어내는 경험이 제
   강점과 맞닿아 있기 때문입니다.
   저는 웨어비즈에서 멀티에이전트 RAG 챗봇 플랫폼을 초기 멤버로 개발하며 GS
   SW 1등급 인증 취득까지 경험했습니다.
   할루시네이션과 토큰 비용이라는 실질적인 문제를 2단계 검증 파이프라인과
   롤링 요약 로직으로 해결해본 경험은, [회사명]이 마주한 검색·대화형 AI
   품질 문제에도 곧바로 적용할 수 있는 역량이라고 생각합니다.
   [회사명]에서 안정적이고 신뢰할 수 있는 AI 서비스를 만드는 데 기여하며,
   데이터 처리와 백엔드 기본기를 바탕으로 시스템 전체를 조망할 수 있는
   개발자로 성장하고 싶습니다.

   ※ 회사마다 새로 쓰세요. 공통 자기소개서는 합격률이 낮습니다.
   ================================================================ */
/* ================================================================
   ▲▲▲  여기까지만 수정  ▲▲▲
   ================================================================ */

function render() {
  const D = DATA;
  document.title = `${D.name} 자기소개서`;

  const sectionsHtml = D.sections.map(s => `
    <div class="section">
      <div class="section-label">${s.label}</div>
      <div class="section-title">${s.title}</div>
      <div class="prose">
        ${s.paragraphs.map(p => `${p.subhead ? `<div class="subhead">${p.subhead}</div>` : ''}<p>${p.text}</p>`).join('')}
      </div>
    </div>
  `).join('');

  // 지원 동기는 paragraphs가 채워졌을 때만 나온다 (지원 시마다 새로 작성)
  const m = D.motivation;
  const motivationHtml = m.paragraphs.length > 0 ? `
    <div class="section">
      <div class="section-label">${m.label}</div>
      <div class="section-title">${m.title}</div>
      <div class="prose">
        ${m.paragraphs.map(p => `<p>${p}</p>`).join('')}
      </div>
    </div>` : '';

  document.body.innerHTML = `
    <div class="page">
      <div class="header">
        <div class="name">${D.name}</div>
        <div class="doc-type">${D.docType}</div>
      </div>
      <div class="body">
        ${sectionsHtml}
        ${motivationHtml}
      </div>
    </div>`;
}
render();
</script>
</body>
</html>
