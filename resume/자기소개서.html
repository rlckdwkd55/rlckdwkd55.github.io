<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>임기창 자기소개서</title>
  <style>
    :root {
      --bg: #F2F2F0;
      --page: #FFFFFF;
      --t1: #0F0F0F;
      --t2: #4B5563;
      --t3: #9CA3AF;
      --accent: #3730A3;
      --accent-soft: #EEF2FF;
      --accent-text: #3730A3;
      --border: #E5E7EB;
      --warn-bg: #FFFBEB;
      --warn-text: #92400E;
      --warn-border: #FDE68A;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--t1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
      font-size: 13.5px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 800px;
      margin: 40px auto;
      background: var(--page);
      border-radius: 4px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .header { padding: 44px 52px 36px; border-bottom: 1px solid var(--border); }
    .name { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .doc-type { margin-top: 6px; font-size: 0.95rem; color: var(--t2); }
    .body { padding: 0 52px 52px; }
    .section { padding-top: 36px; }
    .section-label {
      font-size: 11px; font-weight: 800;
      color: var(--t1);
      border-bottom: 1.5px solid var(--t1);
      padding-bottom: 6px;
      margin-bottom: 16px;
      letter-spacing: 0.01em;
    }
    .section-title { font-size: 15px; font-weight: 800; color: var(--t1); margin-bottom: 12px; }
    .prose { font-size: 13px; color: var(--t2); line-height: 1.85; }
    .prose strong { color: var(--t1); font-weight: 600; }
    .prose p + p { margin-top: 10px; }
    /* Guide block */
    .guide {
      border-left: 2px solid var(--border);
      padding: 4px 14px;
      font-size: 12px;
      color: var(--t3);
      line-height: 1.7;
      margin-bottom: 16px;
    }
    .guide strong { font-weight: 700; color: var(--t2); }
    /* Table */
    .table-wrap { overflow-x: auto; margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      background: var(--bg); color: var(--t2); font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border);
    }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--t2); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    td:first-child { white-space: nowrap; }
    /* Template */
    .template-block {
      border-left: 2px solid var(--border);
      padding: 8px 14px;
      font-size: 12px;
      color: var(--t2);
      line-height: 1.8;
      margin-top: 14px;
      font-style: italic;
    }
    @media print {
      body { background: white; }
      .page { margin: 0; border: none; border-radius: 0; box-shadow: none; max-width: 100%; }
      .guide { display: none; }
    }
  </style>
</head>
<body>
<script>
/* ================================================================
   ▼▼▼  이직 시 이 데이터만 수정하세요  ▼▼▼
   ================================================================ */
const DATA = {
  name: "임기창",
  docType: "자기소개서",
  sections: [
    {
      id: "growth",
      label: "Section 01",
      title: "성장 과정 및 개발자로서의 여정",
      paragraphs: [
        `저의 개발 여정은 <strong>실무에서 발생하는 비효율을 기술적 솔루션으로 해결</strong>하겠다는 명확한 목표에서 출발했습니다. 세무 분야 재직 시절, 매년 반복되는 소모적인 신고 업무를 마주하며 이를 시스템으로 자동화하고자 본격적인 개발자의 길로 들어섰습니다.`,
        `데이터 및 시스템 효율화를 향한 관심은 개발 실무의 뚜렷한 방향성이 되었습니다. 대규모 데이터 크롤링 및 자동화 파이프라인 구축으로 기초를 다졌고, 엔터프라이즈 검색 엔진과 멀티에이전트 AI 플랫폼 개발까지 영역을 넓혀왔습니다.`,
        `시스템 규모가 커질수록 제 관심사는 단순한 기능 구현을 넘어 데이터 증가에도 흔들림 없는 <strong>시스템의 안정성</strong>으로 확장되었습니다. 모듈 역할을 명확히 분리해 확장을 수월하게 만들었던 일과, 예기치 못한 트래픽 증가로 성능 저하를 겪은 뒤 아키텍처를 개선했던 경험은 모두 값진 교훈이 되었습니다. 현장에서 부딪히며 배운 것은, 초기 설계 단계에서 예외 상황을 얼마나 꼼꼼히 대비하느냐가 서비스의 안정성과 직결된다는 점이었습니다.`,
        `이를 바탕으로 단기적인 요구사항 처리에 그치지 않고, 잠재적인 불안정 요소와 비효율을 선제적으로 걷어내며 사용자에게 변치 않는 가치를 제공하는 <strong>단단한 시스템</strong>을 구축하는 데 집중하고 있습니다.`,
      ],
    },
    {
      id: "experience",
      label: "Section 02",
      title: "직무 경험 및 핵심 역량",
      paragraphs: [
        `저의 강점은 주어진 요구사항을 끝까지 파고들어 완성해 내는 실행력입니다. AI 검색 챗봇 플랫폼 <strong>Argos AI Chat Search</strong> 프로젝트에서 검색 결과의 정확도와 신뢰도를 높이며 이를 증명했습니다. LangGraph와 Qdrant 기반에 CrossEncoder 리랭킹 구조를 적용하여 검색 품질을 끌어올렸고, AI 할루시네이션을 방지하고자 응답 검증 로직을 도입해 오답률을 제어했습니다. 면밀한 검증을 거친 결과, <strong>GS 1등급 인증(2026.06)</strong>과 저작권 등록이라는 성과를 달성했습니다.`,
        `그 과정에서 백엔드(FastAPI)뿐만 아니라 프론트엔드(Next.js)와 인프라(Docker) 배포까지 직접 경험했고, 이를 통해 각 계층이 유기적으로 상호작용하며 시스템이 작동하는 전체적인 흐름을 체득할 수 있었습니다.`,
        `전체 시스템을 조망할 수 있었던 배경에는 탄탄한 데이터 처리 기본기가 자리하고 있습니다. 과거 700여 개 사이트 대상의 일일 3,000건 규모 크롤링 시스템과 대용량 엑셀 다운로드 기능을 개발하며 기초를 다졌습니다. 이후 Elasticsearch 기반 <strong>ArgosSearch</strong>의 코어 검색 품질(자동완성, 동의어 처리 등)을 고도화하고, Apache Tika 파이프라인을 유지보수하며 기술적 깊이를 더했습니다. 결과적으로 데이터 처리 및 백엔드 기본기 위에 시스템 전반을 아우르는 시야를 결합해, 서비스를 안정적으로 운영하고 발전시킬 수 있는 역량을 갖추었습니다.`,
      ],
    },
    {
      id: "problem",
      label: "Section 03",
      title: "문제 해결 및 협업 경험",
      paragraphs: [
        `"검색된 문서에도 없는 내용을 지어 낸다면, 그 시스템은 신뢰할 수 없다." AI 챗봇을 개발하며 마주한 가장 치명적인 문제인 <strong>할루시네이션</strong>과 <strong>토큰 비용 증가</strong>를 해결하며 얻은 배움이었습니다.`,
        `초기 모델은 간헐적으로 부정확한 답변을 생성했고, 멀티턴 대화가 길어질수록 컨텍스트가 누적되며 API 토큰 사용량이 빠르게 늘어나는 병목이 발생했습니다. 이를 해결하기 위해 두 가지 접근법을 모색했습니다. 첫째, 할루시네이션 억제를 위해 LLM 기반 <strong>Document Grading</strong>과 <strong>Terminology Validation</strong>이라는 2단계 검증 파이프라인을 구축해 오답률을 크게 낮췄습니다. 둘째, 대화가 진행될 때마다 최근 내역만 남기고 이전 맥락을 요약본으로 교체하는 롤링(rolling) 요약 로직을 도입해, 맥락 손실 없이 누적 토큰 사용량을 제어했습니다.`,
        `이 과정에서 가장 큰 전환점은 동료와의 <strong>빠른 공유와 논의</strong>였습니다. 처음에는 완벽한 구조를 혼자 설계해 보겠다는 생각에 야근을 이어가며 검증 로직과 요약 기준을 붙잡고 있었지만 좀처럼 진척이 나지 않았습니다. 방식을 바꿔 중간 테스트 결과를 동료에게 가감 없이 공유하자 오히려 미처 생각지 못했던 엣지 케이스와 개선점을 빠르게 발견할 수 있었고, 혼자 구상했을 때보다 훨씬 안정적인 방향으로 개선을 마칠 수 있었습니다. 직면한 문제를 투명하게 나눌 때 문제 해결 속도와 품질이 함께 올라간다는 것을 몸소 확인할 수 있었습니다.`,
      ],
    },
    {
      id: "goal",
      label: "Section 04",
      title: "성장 목표",
      paragraphs: [
        `지금까지 개발하며 얻은 가장 큰 수확은, 화려한 기술의 도입보다 <strong>비효율을 해결하고 안정적인 서비스를 제공하는 것</strong>이 훨씬 중요하다는 사실입니다. 대용량 크롤링 시스템에서 병목 원인을 추적했던 경험과, 대화 요약 로직으로 API 호출 비용을 절감하고 2단계 검증으로 답변 품질을 보장했던 과정은 모두 실제 운영 가능한 서비스를 만들기 위한 치열한 고민의 결과물이었습니다.`,
        `입사 후에도 <strong>실용적이고 책임감 있는 태도</strong>를 유지하겠습니다. 단순히 트렌디한 기술을 좇기보다, 당면한 비즈니스 문제와 비효율에 가장 적합하고 안정적인 해결책을 찾는 데 집중하겠습니다. 백엔드 및 데이터 처리 역량을 바탕으로 주어진 과제를 완수하고, 동료들과 투명하게 소통하며 <strong>회사 서비스가 단단하게 성장하는 데 밑거름이 되는 개발자</strong>가 되겠습니다.`,
      ],
    },
  ],
  motivation: {
    label: "Section 05",
    title: "지원 동기 (지원 시마다 새로 작성)",
    guide: "아래는 작성 가이드입니다. 지원 시마다 회사에 맞게 새로 작성하세요. 공통 자기소개서는 합격률이 낮습니다.",
    columns: ["지원 회사 유형", "강조할 경험"],
    rows: [
      { type: "AI 스타트업", point: "LangGraph·Qdrant·RAG 파이프라인, 초기 2인 멤버 경험, GS 인증까지의 전체 과정" },
      { type: "검색 솔루션", point: "Elasticsearch 운영·장애 진단, 검색 도메인 깊이 (자동완성·동의어·오타교정)" },
      { type: "공공 SI / 중견", point: "전자정부프레임워크, 공공기관 납품 대응, 문서화·유지보수 능력" },
      { type: "일반 백엔드", point: "Spring Boot, JPA, API 설계, Docker, 대용량 데이터 처리" },
      { type: "풀스택", point: "Next.js + FastAPI 동시 개발 경험, SSE 스트리밍, Atomic Design" },
    ],
    template: `[회사명]의 [제품명 또는 도메인]에 관심을 갖게 된 것은 [구체적 이유]입니다.\n저는 웨어비즈에서 멀티에이전트 RAG 챗봇 플랫폼을 초기 멤버로 개발하며 GS 1등급 인증 취득까지 경험했습니다.\n이 과정에서 [회사 제품·도메인과 연결되는 내 경험을 구체적으로].\n[회사명]에서 [기여하고 싶은 것]을 통해 [성장 방향]을 이루고 싶습니다.`,
  },
};
/* ================================================================
   ▲▲▲  여기까지만 수정  ▲▲▲
   ================================================================ */

function render() {
  const D = DATA;
  document.title = `${D.name} 자기소개서`;

  const sectionsHtml = D.sections.map(s => `
    <div class="section">
      <div class="section-label">${s.label}</div>
      <div class="section-title">${s.title}</div>
      <div class="prose">
        ${s.paragraphs.map(p => `<p>${p}</p>`).join('')}
      </div>
    </div>
  `).join('');

  /* ── Section 05 지원동기 ─ 나만 보는 템플릿, 지원 시마다 별도 작성 ──
  const rowsHtml = D.motivation.rows.map(r => `
    <tr>
      <td><strong>${r.type}</strong></td>
      <td>${r.point}</td>
    </tr>
  `).join('');
  const templateLines = D.motivation.template.split('\n').join('<br>');
  */

  document.body.innerHTML = `
    <div class="page">
      <div class="header">
        <div class="name">${D.name}</div>
        <div class="doc-type">${D.docType}</div>
      </div>
      <div class="body">
        ${sectionsHtml}
        <!-- Section 05 지원동기: 지원 시마다 새로 작성 — DATA.motivation 참고 -->
      </div>
    </div>`;
}
render();
</script>
</body>
</html>
