<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>임기창 자기소개서</title>
  <style>
    :root {
      --bg: #F2F2F0;
      --page: #FFFFFF;
      --t1: #0F0F0F;
      --t2: #4B5563;
      --t3: #9CA3AF;
      --accent: #3730A3;
      --accent-soft: #EEF2FF;
      --accent-text: #3730A3;
      --border: #E5E7EB;
      --warn-bg: #FFFBEB;
      --warn-text: #92400E;
      --warn-border: #FDE68A;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--t1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
      font-size: 13.5px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 800px;
      margin: 40px auto;
      background: var(--page);
      border-radius: 4px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .header { padding: 44px 52px 36px; border-bottom: 1px solid var(--border); }
    .name { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .doc-type { margin-top: 6px; font-size: 0.95rem; color: var(--t2); }
    .body { padding: 0 52px 52px; }
    .section { padding-top: 36px; }
    .section-label {
      font-size: 11px; font-weight: 800;
      color: var(--t1);
      border-bottom: 1.5px solid var(--t1);
      padding-bottom: 6px;
      margin-bottom: 16px;
      letter-spacing: 0.01em;
    }
    .section-title { font-size: 15px; font-weight: 800; color: var(--t1); margin-bottom: 12px; }
    .prose { font-size: 13px; color: var(--t2); line-height: 1.85; }
    .prose strong { color: var(--t1); font-weight: 600; }
    .prose p + p { margin-top: 10px; }
    /* Guide block */
    .guide {
      border-left: 2px solid var(--border);
      padding: 4px 14px;
      font-size: 12px;
      color: var(--t3);
      line-height: 1.7;
      margin-bottom: 16px;
    }
    .guide strong { font-weight: 700; color: var(--t2); }
    /* Table */
    .table-wrap { overflow-x: auto; margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      background: var(--bg); color: var(--t2); font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border);
    }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--t2); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    td:first-child { white-space: nowrap; }
    /* Template */
    .template-block {
      border-left: 2px solid var(--border);
      padding: 8px 14px;
      font-size: 12px;
      color: var(--t2);
      line-height: 1.8;
      margin-top: 14px;
      font-style: italic;
    }
    @media print {
      body { background: white; }
      .page { margin: 0; border: none; border-radius: 0; box-shadow: none; max-width: 100%; }
      .guide { display: none; }
    }
  </style>
</head>
<body>
<script>
/* ================================================================
   ▼▼▼  이직 시 이 데이터만 수정하세요  ▼▼▼
   ================================================================ */
const DATA = {
  name: "임기창",
  docType: "자기소개서",
  sections: [
    {
      id: "growth",
      label: "Section 01",
      title: "성장 과정 및 개발자로서의 여정",
      paragraphs: [
        `<strong>실무 현장의 비효율을 기술로 해결하는 것</strong>, 저의 개발 여정은 이 목표에서 출발했습니다. 과거 세무 분야에서 근무하며 매년 반복되는 신고 업무를 마주했고, 이 소모적인 과정을 시스템으로 자동화하고 싶다는 갈증이 저를 본격적인 개발의 길로 이끌었습니다.`,
        `단순 반복 업무를 코드로 개선하고자 했던 이 목표 의식은 실제 개발 실무에서도 명확한 방향성이 되었습니다. 공공 SI 환경에서 대규모 데이터 크롤링·자동화 파이프라인을 구축하며 시스템 기반을 다졌고, 현재는 엔터프라이즈 검색 엔진과 멀티에이전트 AI 챗봇을 설계하는 풀스택 개발자로 성장했습니다.`,
        `다양한 프로젝트를 거치며 시스템 규모가 커지고 복잡해질수록, 저는 '기능의 작동 여부'보다 <strong>'구조의 견고함'</strong>에 더 집중하게 되었습니다. 각 역할과 인터페이스를 명확히 분리해둔 덕분에 훗날 기능 확장을 수월하게 이뤄낸 뿌듯한 경험도 있었지만, 반대로 보이지 않는 서버 설정을 간과해 실운영 중 장애를 마주했던 뼈아픈 순간도 있었습니다. 이처럼 현장에서 직접 부딪히며 얻은 성공과 실패의 경험들은, 초기 설계의 견고함이 향후 서비스의 확장성과 안정성을 좌우한다는 저만의 확고한 개발 철학을 만들어 주었습니다.`,
        `실운영의 고충을 누구보다 잘 알기에, 단기적인 기능 구현에 안주하지 않습니다. 장애 발생 시 원인 추적이 명확하고, 장기적인 관점에서 <strong>새로운 기술을 유연하게 확장할 수 있는 아키텍처 설계에 집중</strong>하고 있습니다.`,
      ],
    },
    {
      id: "experience",
      label: "Section 02",
      title: "직무 경험 및 핵심 역량",
      paragraphs: [
        `저의 핵심 역량은 <strong>0에서 1을 만드는 멀티에이전트 AI 시스템 설계력</strong>입니다. 웨어비즈에서 <strong>초기 멤버 2인</strong> 중 한 명으로 멀티에이전트 RAG 챗봇 플랫폼(Argos AI Chat Search)을 기획 단계부터 함께 개발하며 제품의 핵심 구조를 직접 설계했습니다. LangGraph로 Supervisor 아키텍처 기반 멀티에이전트를 구성하고, Qdrant 벡터 검색에 CrossEncoder 리랭킹을 결합한 파이프라인과 유사도 임계값 초과 시 즉시 응답하는 시나리오 에이전트를 구현해, 이 제품은 <strong>GS 1등급 인증 취득(TTA, 2026.06)·저작권 등록(2026.03)</strong>을 마치고 실제 고객사에 납품되는 성과로 이어졌습니다.`,
        `두 번째 역량은 <strong>제품의 전체 생애주기를 책임지는 풀스택 실행력</strong>입니다. FastAPI·SQLAlchemy 기반 멀티테넌트 관리자 API부터 Next.js·Zustand 기반 관리자 대시보드·챗봇 위젯, NVIDIA GPU 서버 Docker 배포까지 백엔드와 프론트엔드 전 영역을 혼자 감당하며, 기획부터 배포와 인증까지 제품이 세상에 나오는 전 과정을 경험했습니다. 소규모 팀에서 이 정도 범위를 책임질 수 있었던 것은 각 영역을 얕게 아는 것이 아니라, 병목이 생기는 지점을 스스로 진단하고 해결할 수 있었기 때문입니다.`,
        `세 번째 역량은 <strong>검색 도메인에 대한 깊은 이해와 대용량 데이터 처리 경험</strong>입니다. Elasticsearch 기반 엔터프라이즈 검색 엔진(ArgosSearch)에서 자동완성·연관검색어·오타교정·동의어 처리 등 검색 핵심 기능과 다중 외부 DB 연동, Apache Tika 문서 파싱 파이프라인을 유지보수하며 검색 품질을 실제로 좌우하는 디테일을 다뤄왔습니다. 이 역량의 뿌리는 이전 케니컴퍼니에서 700개 이상 사이트를 대상으로 일 3,000건 규모의 크롤링 시스템과 SXSSFWorkbook 기반 대용량 엑셀 다운로드 기능을 개발하며 다진 대용량 데이터 처리 기초에 있습니다. 당시 전자정부프레임워크 기반으로 유지보수했던 공공 시스템(GBMS, 버스파인)은 현재도 경기도 광역버스 관리 시스템과 시내버스 행정 시스템으로 납품·운영되고 있습니다.`,
      ],
    },
    {
      id: "problem",
      label: "Section 03",
      title: "문제 해결 및 협업 경험",
      paragraphs: [
        `"검색된 문서에도 없는 내용을 답이 지어낸다면, 그 시스템은 신뢰할 수 없다." AI 챗봇을 개발하며 가장 먼저 마주한 문제였습니다. 이 할루시네이션은 LLM 기반 Document Grading과 Terminology Validation 2단계 검증으로 억제했고, 멀티턴 대화에서 토큰 사용량이 누적되는 문제는 일정 대화 수를 넘어가면 이전 대화를 요약 프롬프트로 압축해 맥락은 유지하면서 토큰을 절약하는 방식으로 풀어냈습니다.`,
        `검색 엔진을 운영하면서는 장애 원인을 끝까지 추적해 해결하는 근성을 키웠습니다. Tibero를 사용하는 고객사에서 색인 스케줄러가 간헐적으로 중단되는 현상을 DB 커넥션 풀이 모두 점유되어 발생한 문제로 좁혀내 설정을 조정했고, HTTP 본문 크기가 100MB를 초과해 일부 데이터가 색인되지 않던 문제는 Elasticsearch의 <code>http.max_content_length</code> 값을 상향 조정해 해결했습니다. 이전 크롤링 시스템 개발에서 겪은 CORS 차단 문제도 Proxy 서버 구조로 개선해 안정적인 수집 환경을 확보했습니다.`,
        `이 과정에서 얻은 가장 중요한 배움은 <strong>문제를 혼자 붙잡고 있기보다 빠르게 팀에 공유할 때 해결이 더 빨라진다</strong>는 것입니다. ArgosSearch 운영 중 커넥션 풀 고갈로 서버가 다운됐을 때도, 원인을 파악하는 동시에 로그 분석 결과를 팀에 공유하고 설정 변경 방향을 함께 논의해 재발을 막았습니다. 작은 팀일수록 각자가 마주한 문제와 해결 과정을 적극적으로 나눌 때 제품의 안정성이 빠르게 올라간다는 것을 실무로 확인했습니다.`,
      ],
    },
    {
      id: "goal",
      label: "Section 04",
      title: "성장 목표",
      paragraphs: [
        `GS 인증까지 완수한 RAG 챗봇 플랫폼을 만들며 얻은 가장 큰 배움은, AI 시스템은 잘 동작하는 것만으로 부족하고 <strong>비용·응답 속도·안정성을 함께 고려해야 실제 운영이 가능하다</strong>는 것입니다. 시나리오 에이전트로 LLM 호출 비용을 줄이고, 커넥션 풀 설정으로 서버 안정성을 확보한 경험이 그 출발점이었습니다. 앞으로는 작동하는 AI 시스템을 만드는 것에 그치지 않고, 운영 비용과 장애 대응까지 고려한 시스템을 구현하는 역량을 더 깊이 발전시켜 나가고 싶습니다. 기술이 빠르게 변하는 AI 도메인에서도 기초를 탄탄히 유지하면서, 새로운 기술을 실무에 유연하게 접목할 수 있는 개발자로 성장하겠습니다.`,
      ],
    },
  ],
  motivation: {
    label: "Section 05",
    title: "지원 동기 (지원 시마다 새로 작성)",
    guide: "아래는 작성 가이드입니다. 지원 시마다 회사에 맞게 새로 작성하세요. 공통 자기소개서는 합격률이 낮습니다.",
    columns: ["지원 회사 유형", "강조할 경험"],
    rows: [
      { type: "AI 스타트업", point: "LangGraph·Qdrant·RAG 파이프라인, 초기 2인 멤버 경험, GS 인증까지의 전체 과정" },
      { type: "검색 솔루션", point: "Elasticsearch 운영·장애 진단, 검색 도메인 깊이 (자동완성·동의어·오타교정)" },
      { type: "공공 SI / 중견", point: "전자정부프레임워크, 공공기관 납품 대응, 문서화·유지보수 능력" },
      { type: "일반 백엔드", point: "Spring Boot, JPA, API 설계, Docker, 대용량 데이터 처리" },
      { type: "풀스택", point: "Next.js + FastAPI 동시 개발 경험, SSE 스트리밍, Atomic Design" },
    ],
    template: `[회사명]의 [제품명 또는 도메인]에 관심을 갖게 된 것은 [구체적 이유]입니다.\n저는 웨어비즈에서 멀티에이전트 RAG 챗봇 플랫폼을 초기 멤버로 개발하며 GS 1등급 인증 취득까지 경험했습니다.\n이 과정에서 [회사 제품·도메인과 연결되는 내 경험을 구체적으로].\n[회사명]에서 [기여하고 싶은 것]을 통해 [성장 방향]을 이루고 싶습니다.`,
  },
};
/* ================================================================
   ▲▲▲  여기까지만 수정  ▲▲▲
   ================================================================ */

function render() {
  const D = DATA;
  document.title = `${D.name} 자기소개서`;

  const sectionsHtml = D.sections.map(s => `
    <div class="section">
      <div class="section-label">${s.label}</div>
      <div class="section-title">${s.title}</div>
      <div class="prose">
        ${s.paragraphs.map(p => `<p>${p}</p>`).join('')}
      </div>
    </div>
  `).join('');

  /* ── Section 05 지원동기 ─ 나만 보는 템플릿, 지원 시마다 별도 작성 ──
  const rowsHtml = D.motivation.rows.map(r => `
    <tr>
      <td><strong>${r.type}</strong></td>
      <td>${r.point}</td>
    </tr>
  `).join('');
  const templateLines = D.motivation.template.split('\n').join('<br>');
  */

  document.body.innerHTML = `
    <div class="page">
      <div class="header">
        <div class="name">${D.name}</div>
        <div class="doc-type">${D.docType}</div>
      </div>
      <div class="body">
        ${sectionsHtml}
        <!-- Section 05 지원동기: 지원 시마다 새로 작성 — DATA.motivation 참고 -->
      </div>
    </div>`;
}
render();
</script>
</body>
</html>
