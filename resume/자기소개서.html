<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>임기창 자기소개서</title>
  <style>
    :root {
      --bg: #F2F2F0;
      --page: #FFFFFF;
      --t1: #0F0F0F;
      --t2: #4B5563;
      --t3: #9CA3AF;
      --accent: #3730A3;
      --accent-soft: #EEF2FF;
      --accent-text: #3730A3;
      --border: #E5E7EB;
      --warn-bg: #FFFBEB;
      --warn-text: #92400E;
      --warn-border: #FDE68A;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--t1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
      font-size: 13.5px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 800px;
      margin: 40px auto;
      background: var(--page);
      border-radius: 4px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .header { padding: 44px 52px 36px; border-bottom: 1px solid var(--border); }
    .name { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .doc-type { margin-top: 6px; font-size: 0.95rem; color: var(--t2); }
    .body { padding: 0 52px 52px; }
    .section { padding-top: 36px; }
    .section-label {
      font-size: 11px; font-weight: 800;
      color: var(--t1);
      border-bottom: 1.5px solid var(--t1);
      padding-bottom: 6px;
      margin-bottom: 16px;
      letter-spacing: 0.01em;
    }
    .section-title { font-size: 15px; font-weight: 800; color: var(--t1); margin-bottom: 12px; }
    .prose { font-size: 13px; color: var(--t2); line-height: 1.85; }
    .prose strong { color: var(--t1); font-weight: 600; }
    .prose p + p { margin-top: 10px; }
    .prose .subhead {
      font-weight: 700; color: var(--accent-text); font-size: 13px;
      margin: 22px 0 7px; letter-spacing: -0.01em;
      padding-left: 11px; position: relative;
    }
    .prose .subhead::before {
      content: ''; position: absolute; left: 0; top: 3px; bottom: 3px;
      width: 3px; border-radius: 2px; background: var(--accent);
    }
    .prose .subhead:first-child { margin-top: 0; }
    /* Guide block */
    .guide {
      border-left: 2px solid var(--border);
      padding: 4px 14px;
      font-size: 12px;
      color: var(--t3);
      line-height: 1.7;
      margin-bottom: 16px;
    }
    .guide strong { font-weight: 700; color: var(--t2); }
    /* Table */
    .table-wrap { overflow-x: auto; margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      background: var(--bg); color: var(--t2); font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border);
    }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--t2); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    td:first-child { white-space: nowrap; }
    /* Template */
    .template-block {
      border-left: 2px solid var(--border);
      padding: 8px 14px;
      font-size: 12px;
      color: var(--t2);
      line-height: 1.8;
      margin-top: 14px;
      font-style: italic;
    }
    @media print {
      body { background: white; }
      .page { margin: 0; border: none; border-radius: 0; box-shadow: none; max-width: 100%; }
      .guide { display: none; }
    }
  </style>
</head>
<body>
<script>
/* ================================================================
   ▼▼▼  이직 시 이 데이터만 수정하세요  ▼▼▼
   ================================================================ */
const DATA = {
  name: "임기창",
  docType: "자기소개서",
  sections: [
    {
      id: "core",
      label: "Section 01",
      title: "개발자가 된 계기와 지향점",
      paragraphs: [
        { text: `세무 실무를 하다 보면 반복되는 수작업이 많았는데, 이런 일을 조금 더 편하게 만들 방법이 없을까 궁금해지곤 했습니다. 그 궁금증이 개발로 이어졌고, 지금도 더 나은 방법을 찾아보는 과정 자체에 재미를 느낍니다.` },
        { text: `실무 3년 차인 지금은 멀티에이전트 RAG 챗봇 플랫폼 <strong>Argos AI Chat Search</strong>에서 백엔드 도메인 API와 관리자 대시보드, 인프라를 맡고 있습니다. 기능을 빨리 늘리기보다 한정된 자원을 아껴 쓰고 오래 안정적으로 쓰이는 결과물을 만드는 쪽을 더 좋아합니다. 불필요한 LLM 호출을 줄여 응답과 비용을 낮추고, 모델을 설정만으로 바꿀 수 있게 구조를 잡아둔 것도 그런 생각에서 나온 선택이었습니다.` },
        { text: `이 플랫폼은 개발을 이어오며 <strong>GS SW 1등급 인증</strong>과 공공기관 납품이라는 성과를 거뒀으며, 동시에 검색 엔진 <strong>ArgosSearch</strong>를 운영하며 고객사에서 생기는 문제도 직접 해결하고 있습니다. 이렇게 실제 사용자와 맞닿은 시스템을 다루며, 안정적으로 오래 쓰이는 결과물의 가치를 배우고 있습니다.` },
      ],
    },
    {
      id: "approach",
      label: "Section 02",
      title: "문제를 대하는 방식",
      paragraphs: [
        { text: `기능 하나를 만들 때도 그것이 시스템 전체에 어떤 영향을 줄지 먼저 살피고, 정상 흐름 이면의 실패 경로까지 짚어 위험을 미리 줄이려 합니다. 또 문제를 혼자 안고 있기보다 동료들과 코드를 함께 보며 풀어가는 편입니다.` },
        { subhead: `데이터 영구 유실을 막은 선제적 코드 리뷰`, text: `현재 담당 중인 <strong>Argos AI Chat Search</strong>에서 외부 DB에 등록된 문서의 재임베딩 로직을 코드 리뷰할 때의 일입니다. 코드는 '기존 벡터 삭제 후 새 임베딩 생성' 순서였고, 정상 동작에는 문제가 없어 보였습니다. 다만 리뷰 중에 "외부 API 호출이나 저장이 중간에 한 번이라도 실패하면, 이미 지운 데이터는 어떻게 되지?"라는 의문이 들었습니다.` },
        { text: `실패 경로를 동료와 함께 따라가 보니, 재생성이 중간에 멈추면 원본 문서가 복구할 수 없이 사라지는 구조였습니다. 그래서 '재생성 성공을 먼저 확인한 뒤 기존 벡터를 삭제'하도록 순서를 뒤집자고 제안했고, 덕분에 재임베딩이 실패해도 기존 데이터는 그대로 남게 됐습니다.` },
        { text: `혼자였다면 정상 흐름만 보고 지나쳤을 문제였는데, 함께 들여다본 덕분에 미리 잡을 수 있었습니다. 그 뒤로 코드를 볼 때면 정상 동작만큼이나 '실패했을 때 어떻게 되는가'를 먼저 고민하려 노력합니다.` },
      ],
    },
  ],
  motivation: {
    label: "Section 03",
    title: "지원 동기 (지원 시마다 새로 작성)",
    guide: "아래는 작성 가이드입니다. 지원 시마다 회사에 맞게 새로 작성하세요. 공통 자기소개서는 합격률이 낮습니다.",
    columns: ["지원 회사 유형", "강조할 경험"],
    rows: [
      { type: "AI 스타트업", point: "LangGraph·Qdrant·RAG 파이프라인, GS 인증까지의 전체 과정" },
      { type: "검색 솔루션", point: "Elasticsearch 운영·장애 진단, 색인 스케줄러·커넥션 풀 트러블슈팅 경험" },
      { type: "공공 SI / 중견", point: "전자정부프레임워크, 공공기관 납품 대응, 문서화·유지보수 능력" },
      { type: "일반 백엔드", point: "Spring Boot, JPA, API 설계, Docker, 대용량 데이터 처리" },
      { type: "프론트 경험 요구 포지션", point: "Next.js 관리자 대시보드 + FastAPI API 개발, SSE 스트리밍 경험" },
    ],
    template: `[회사명]의 [제품명 또는 도메인]에 관심을 갖게 된 것은 [구체적 이유]입니다.\n저는 웨어비즈에서 멀티에이전트 RAG 챗봇 플랫폼을 초기 멤버로 개발하며 GS SW 1등급 인증 취득까지 경험했습니다.\n이 과정에서 [회사 제품·도메인과 연결되는 내 경험을 구체적으로].\n[회사명]에서 [기여하고 싶은 것]을 통해 [성장 방향]을 이루고 싶습니다.`,
  },
};
/* ================================================================
   Section 05 지원 동기 — 초안 (렌더링되지 않음, 지원 시 참고용)
   실제 지원할 회사가 정해지면 [회사명] 등을 채워 DATA.motivation에 반영하고
   render()에서 다시 활성화하세요. "AI 스타트업" 유형 기준 초안입니다.

   [회사명]의 AI 검색·대화형 서비스에 관심을 갖게 된 것은, 정확성과 신뢰도가
   생명인 도메인에서 실제 운영 가능한 수준의 안정성을 만들어내는 경험이 제
   강점과 맞닿아 있기 때문입니다.
   저는 웨어비즈에서 멀티에이전트 RAG 챗봇 플랫폼을 초기 멤버로 개발하며 GS
   SW 1등급 인증 취득까지 경험했습니다.
   할루시네이션과 토큰 비용이라는 실질적인 문제를 2단계 검증 파이프라인과
   롤링 요약 로직으로 해결해본 경험은, [회사명]이 마주한 검색·대화형 AI
   품질 문제에도 곧바로 적용할 수 있는 역량이라고 생각합니다.
   [회사명]에서 안정적이고 신뢰할 수 있는 AI 서비스를 만드는 데 기여하며,
   데이터 처리와 백엔드 기본기를 바탕으로 시스템 전체를 조망할 수 있는
   개발자로 성장하고 싶습니다.
   ================================================================ */
/* ================================================================
   ▲▲▲  여기까지만 수정  ▲▲▲
   ================================================================ */

function render() {
  const D = DATA;
  document.title = `${D.name} 자기소개서`;

  const sectionsHtml = D.sections.map(s => `
    <div class="section">
      <div class="section-label">${s.label}</div>
      <div class="section-title">${s.title}</div>
      <div class="prose">
        ${s.paragraphs.map(p => `${p.subhead ? `<div class="subhead">${p.subhead}</div>` : ''}<p>${p.text}</p>`).join('')}
      </div>
    </div>
  `).join('');

  /* ── Section 05 지원동기 ─ 나만 보는 템플릿, 지원 시마다 별도 작성 ──
  const rowsHtml = D.motivation.rows.map(r => `
    <tr>
      <td><strong>${r.type}</strong></td>
      <td>${r.point}</td>
    </tr>
  `).join('');
  const templateLines = D.motivation.template.split('\n').join('<br>');
  */

  document.body.innerHTML = `
    <div class="page">
      <div class="header">
        <div class="name">${D.name}</div>
        <div class="doc-type">${D.docType}</div>
      </div>
      <div class="body">
        ${sectionsHtml}
        <!-- Section 05 지원동기: 지원 시마다 새로 작성 — DATA.motivation 참고 -->
      </div>
    </div>`;
}
render();
</script>
</body>
</html>
