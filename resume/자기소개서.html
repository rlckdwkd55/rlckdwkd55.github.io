<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>임기창 자기소개서</title>
  <style>
    :root {
      --bg: #F2F2F0;
      --page: #FFFFFF;
      --t1: #0F0F0F;
      --t2: #4B5563;
      --t3: #9CA3AF;
      --accent: #3730A3;
      --accent-soft: #EEF2FF;
      --accent-text: #3730A3;
      --border: #E5E7EB;
      --warn-bg: #FFFBEB;
      --warn-text: #92400E;
      --warn-border: #FDE68A;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--t1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
      font-size: 13.5px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 800px;
      margin: 40px auto;
      background: var(--page);
      border-radius: 4px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .header { padding: 44px 52px 36px; border-bottom: 1px solid var(--border); }
    .name { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .doc-type { margin-top: 6px; font-size: 0.95rem; color: var(--t2); }
    .body { padding: 0 52px 52px; }
    .section { padding-top: 36px; }
    .section-label {
      font-size: 11px; font-weight: 800;
      color: var(--t1);
      border-bottom: 1.5px solid var(--t1);
      padding-bottom: 6px;
      margin-bottom: 16px;
      letter-spacing: 0.01em;
    }
    .section-title { font-size: 15px; font-weight: 800; color: var(--t1); margin-bottom: 12px; }
    .prose { font-size: 13px; color: var(--t2); line-height: 1.85; }
    .prose strong { color: var(--t1); font-weight: 600; }
    .prose p + p { margin-top: 10px; }
    /* Guide block */
    .guide {
      border-left: 2px solid var(--border);
      padding: 4px 14px;
      font-size: 12px;
      color: var(--t3);
      line-height: 1.7;
      margin-bottom: 16px;
    }
    .guide strong { font-weight: 700; color: var(--t2); }
    /* Table */
    .table-wrap { overflow-x: auto; margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      background: var(--bg); color: var(--t2); font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border);
    }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--t2); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    td:first-child { white-space: nowrap; }
    /* Template */
    .template-block {
      border-left: 2px solid var(--border);
      padding: 8px 14px;
      font-size: 12px;
      color: var(--t2);
      line-height: 1.8;
      margin-top: 14px;
      font-style: italic;
    }
    @media print {
      body { background: white; }
      .page { margin: 0; border: none; border-radius: 0; box-shadow: none; max-width: 100%; }
      .guide { display: none; }
    }
  </style>
</head>
<body>
<script>
/* ================================================================
   ▼▼▼  이직 시 이 데이터만 수정하세요  ▼▼▼
   ================================================================ */
const DATA = {
  name: "임기창",
  docType: "자기소개서",
  sections: [
    {
      id: "core",
      label: "Section 01",
      title: "핵심 역량과 성과",
      paragraphs: [
        `"이 반복 작업, 더 효율적으로 할 수 없을까?" 세무 업무 중 가졌던 고민은 저를 개발자의 길로 이끌었습니다. 지금은 3년차 개발자입니다.`,
        `<strong>Argos AI Chat Search</strong> 프로젝트에서는 도메인 API 및 관리자 대시보드 개발과 인프라 배포를 전담했습니다. 특히 임계값 기반의 응답 처리로 불필요한 LLM 호출을 차단해 응답 지연을 대폭 개선했으며, 그 결과 <strong>GS SW 1등급 인증</strong> 및 저작권 등록이라는 성과를 거두었습니다. <strong>ArgosSearch</strong> 운영 시에는 고객사 장애를 직접 진단하고 해결하며 서비스 안정성을 높이는 데 기여했습니다.`,
        `저는 눈앞의 기능 하나보다, 그 기능이 시스템 전체에 어떤 영향을 미칠지부터 먼저 따져보는 개발자입니다.`,
      ],
    },
    {
      id: "approach",
      label: "Section 02",
      title: "문제를 대하는 방식",
      paragraphs: [
        `"근거 없는 답변은 시스템의 신뢰를 무너뜨린다." AI 챗봇 개발 시 가장 집중한 부분은 답변의 정확성과 신뢰성이었습니다.`,
        `일례로 검증 파이프라인에서 발생한 논리적 오류를 끈질기게 추적해 해결한 경험이 있습니다. 질문 재작성(Rewrite) 이후 검증 로직이 엉뚱한 결과를 반환하는 원인을 분석한 결과, 재작성된 질문이 검증 기준이 된 것을 파악했습니다. 원본 질문을 따로 보존해 검증 기준으로 삼도록 아키텍처를 수정해 문제를 말끔히 해결했습니다.`,
        `이 과정에서 막힌 문제를 혼자 껴안고 있기보다, 동료들에게 중간 과정을 투명하게 공유할 때 해결의 실마리를 더 빨리 찾을 수 있었습니다. <strong>문제는 감추는 것이 아니라 먼저 꺼내놓고 함께 푸는 것</strong>, 이것이 제가 협업하고 성장하는 방식입니다.`,
      ],
    },
  ],
  motivation: {
    label: "Section 05",
    title: "지원 동기 (지원 시마다 새로 작성)",
    guide: "아래는 작성 가이드입니다. 지원 시마다 회사에 맞게 새로 작성하세요. 공통 자기소개서는 합격률이 낮습니다.",
    columns: ["지원 회사 유형", "강조할 경험"],
    rows: [
      { type: "AI 스타트업", point: "LangGraph·Qdrant·RAG 파이프라인, GS 인증까지의 전체 과정" },
      { type: "검색 솔루션", point: "Elasticsearch 운영·장애 진단, 색인 스케줄러·커넥션 풀 트러블슈팅 경험" },
      { type: "공공 SI / 중견", point: "전자정부프레임워크, 공공기관 납품 대응, 문서화·유지보수 능력" },
      { type: "일반 백엔드", point: "Spring Boot, JPA, API 설계, Docker, 대용량 데이터 처리" },
      { type: "풀스택", point: "Next.js + FastAPI 동시 개발 경험, SSE 스트리밍, Atomic Design" },
    ],
    template: `[회사명]의 [제품명 또는 도메인]에 관심을 갖게 된 것은 [구체적 이유]입니다.\n저는 웨어비즈에서 멀티에이전트 RAG 챗봇 플랫폼을 초기 멤버로 개발하며 GS 1등급 인증 취득까지 경험했습니다.\n이 과정에서 [회사 제품·도메인과 연결되는 내 경험을 구체적으로].\n[회사명]에서 [기여하고 싶은 것]을 통해 [성장 방향]을 이루고 싶습니다.`,
  },
};
/* ================================================================
   Section 05 지원 동기 — 초안 (렌더링되지 않음, 지원 시 참고용)
   실제 지원할 회사가 정해지면 [회사명] 등을 채워 DATA.motivation에 반영하고
   render()에서 다시 활성화하세요. "AI 스타트업" 유형 기준 초안입니다.

   [회사명]의 AI 검색·대화형 서비스에 관심을 갖게 된 것은, 정확성과 신뢰도가
   생명인 도메인에서 실제 운영 가능한 수준의 안정성을 만들어내는 경험이 제
   강점과 맞닿아 있기 때문입니다.
   저는 웨어비즈에서 멀티에이전트 RAG 챗봇 플랫폼을 초기 멤버로 개발하며 GS
   1등급 인증 취득까지 경험했습니다.
   할루시네이션과 토큰 비용이라는 실질적인 문제를 2단계 검증 파이프라인과
   롤링 요약 로직으로 해결해본 경험은, [회사명]이 마주한 검색·대화형 AI
   품질 문제에도 곧바로 적용할 수 있는 역량이라고 생각합니다.
   [회사명]에서 안정적이고 신뢰할 수 있는 AI 서비스를 만드는 데 기여하며,
   데이터 처리와 백엔드 기본기를 바탕으로 시스템 전체를 조망할 수 있는
   개발자로 성장하고 싶습니다.
   ================================================================ */
/* ================================================================
   ▲▲▲  여기까지만 수정  ▲▲▲
   ================================================================ */

function render() {
  const D = DATA;
  document.title = `${D.name} 자기소개서`;

  const sectionsHtml = D.sections.map(s => `
    <div class="section">
      <div class="section-label">${s.label}</div>
      <div class="section-title">${s.title}</div>
      <div class="prose">
        ${s.paragraphs.map(p => `<p>${p}</p>`).join('')}
      </div>
    </div>
  `).join('');

  /* ── Section 05 지원동기 ─ 나만 보는 템플릿, 지원 시마다 별도 작성 ──
  const rowsHtml = D.motivation.rows.map(r => `
    <tr>
      <td><strong>${r.type}</strong></td>
      <td>${r.point}</td>
    </tr>
  `).join('');
  const templateLines = D.motivation.template.split('\n').join('<br>');
  */

  document.body.innerHTML = `
    <div class="page">
      <div class="header">
        <div class="name">${D.name}</div>
        <div class="doc-type">${D.docType}</div>
      </div>
      <div class="body">
        ${sectionsHtml}
        <!-- Section 05 지원동기: 지원 시마다 새로 작성 — DATA.motivation 참고 -->
      </div>
    </div>`;
}
render();
</script>
</body>
</html>
