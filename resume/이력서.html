<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>임기창 이력서</title>
  <style>
    :root {
      --bg: #F2F2F0;
      --page: #FFFFFF;
      --t1: #0F0F0F;
      --t2: #4B5563;
      --t3: #9CA3AF;
      --accent-text: #3730A3;
      --accent-soft: #EEF2FF;
      --tag-bg: #FAFAF9;
      --tag-border: #D9D9D4;
      --border: #E5E7EB;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--t1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 820px;
      margin: 36px auto;
      background: var(--page);
      border-radius: 4px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    /* ── HEADER ── */
    .header { padding: 36px 52px 26px; border-bottom: 1px solid var(--border); }
    .header-layout { display: flex; gap: 28px; align-items: flex-start; margin-bottom: 14px; }
    .photo {
      width: 90px; height: 90px;
      border-radius: 10px;
      object-fit: cover; object-position: center top;
      flex-shrink: 0;
      border: 1px solid var(--border);
      display: block;
    }
    .photo-fallback {
      width: 90px; height: 90px;
      border-radius: 10px;
      background: #F3F4F6;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-info { flex: 1; }
    .name { font-size: 2rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin-bottom: 5px; }
    .job-title { font-size: 0.88rem; color: var(--t2); margin-bottom: 12px; }
    .contact-row { display: flex; flex-wrap: wrap; column-gap: 16px; row-gap: 4px; font-size: 11.5px; color: var(--t2); }
    .contact-row a { color: var(--t2); text-decoration: none; }
    .cl { font-size: 10px; font-weight: 700; color: var(--t3); letter-spacing: 0.04em; margin-right: 5px; }
    .summary {
      font-size: 13px; color: var(--t2); line-height: 1.8;
      border-left: 2px solid var(--border);
      padding-left: 14px;
    }
    .summary strong { color: var(--t1); font-weight: 600; }

    /* ── BODY ── */
    .body { padding: 0 52px 22px; }
    .section { padding-top: 16px; }
    .section-label {
      font-size: 11px; font-weight: 800;
      color: var(--t1);
      border-bottom: 1.5px solid var(--t1);
      padding-bottom: 6px;
      margin-bottom: 14px;
      letter-spacing: 0.01em;
    }

    /* 학력·자격증처럼 항목이 짧은 섹션은 2열로 묶어 지면을 아낀다 */
    .section.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }

    /* ── HIGHLIGHTS ── */
    .highlight-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .highlight-list li {
      position: relative;
      padding: 7px 12px 7px 26px;
      background: var(--accent-soft);
      border-left: 2px solid var(--accent-text);
      border-radius: 0 4px 4px 0;
      font-size: 12.5px; line-height: 1.6; color: var(--t2);
    }
    .highlight-list li::before {
      content: '▸';
      position: absolute; left: 11px; top: 8px;
      color: var(--accent-text); font-size: 11px;
    }
    .highlight-list strong { color: var(--accent-text); font-weight: 700; }
    .highlight-note {
      margin-top: 8px; text-align: right;
      font-size: 11px; color: var(--t3);
    }

    /* ── SKILLS ── */
    .tech-grid { display: grid; grid-template-columns: 76px 1fr; gap: 4px 14px; align-items: start; }
    .tech-cat { font-size: 11px; font-weight: 600; color: var(--t2); padding-top: 3px; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag {
      background: var(--tag-bg);
      color: #1F2937;
      border: 1px solid var(--tag-border);
      padding: 1px 8px;
      border-radius: 4px;
      font-size: 10.5px;
    }

    /* ── CAREER ── */
    .career-item { margin-bottom: 18px; }
    .career-item:last-child { margin-bottom: 0; }
    .career-header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 2px; }
    .company { font-size: 14px; font-weight: 700; }
    .period { font-size: 11px; color: var(--t3); white-space: nowrap; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .position { font-size: 11.5px; color: var(--t2); margin-bottom: 12px; }

    /* 프로젝트 서브리스트 */
    .proj-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .proj-entry {
      padding: 8px 12px;
      background: #FAFAF8;
      border-radius: 4px;
      border-left: 2px solid #DDDBD6;
    }
    .proj-entry-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 6px;
    }
    .proj-entry-name { font-size: 12px; font-weight: 700; color: var(--t1); margin-bottom: 2px; }
    .proj-entry-desc { font-size: 11.5px; color: var(--t2); line-height: 1.55; }
    .proj-entry-meta { flex-shrink: 0; text-align: right; }
    .proj-entry-period { font-size: 10.5px; color: var(--t3); white-space: nowrap; padding-top: 1px; }
    .proj-entry-contribution { font-size: 10.5px; color: var(--accent-text); font-weight: 600; white-space: nowrap; margin-top: 2px; }
    .proj-entry-bullets { padding-top: 2px; }

    .sub-label { font-size: 10.5px; font-weight: 700; color: var(--t3); margin-bottom: 7px; letter-spacing: 0.03em; }
    .bullets { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .bullets li { font-size: 12px; color: var(--t2); padding-left: 14px; position: relative; line-height: 1.65; }
    .bullets li::before { content:'–'; position: absolute; left: 0; color: var(--t3); }
    .bullets li strong { color: var(--t1); font-weight: 600; }
    .badge {
      display: inline-block;
      background: #F5F4F0; color: #555;
      font-size: 10.5px; font-weight: 600;
      padding: 3px 9px; border-radius: 3px; margin-top: 8px;
      border: 1px solid #E0DDD8;
    }

    /* ── 개인 프로젝트 ── */
    .proj-row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 2px; }
    .proj-name { font-size: 12.5px; font-weight: 700; }
    .proj-period-sm { font-size: 11px; color: var(--t3); white-space: nowrap; flex-shrink: 0; }
    .proj-meta { font-size: 11px; color: var(--t3); margin-bottom: 2px; }
    .proj-desc { font-size: 12px; color: var(--t2); line-height: 1.55; }

    /* ── EDU ── */
    .edu-list { display: flex; flex-direction: column; gap: 6px; }
    .edu-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    .edu-name { font-size: 12.5px; font-weight: 600; line-height: 1.45; }
    .edu-detail { font-size: 11.5px; color: var(--t2); margin-top: 0; line-height: 1.45; }
    .edu-period { font-size: 11px; color: var(--t3); white-space: nowrap; flex-shrink: 0; font-variant-numeric: tabular-nums; }

    @page { size: A4; margin: 12mm 14mm; }
    @media print {
      html, body { background: #fff; }
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .page { margin: 0; border: none; border-radius: 0; box-shadow: none; max-width: 100%; overflow: visible; }
      .header { padding: 0 0 10px; }
      .body { padding: 0; }
      .section { padding-top: 11px; }
      /* 마지막 섹션의 잔여 여백이 새 페이지를 만들지 않도록 */
      .section:last-child { padding-bottom: 0; }
      .page { padding-bottom: 0; }
      .section-label { break-after: avoid; }
      .header, .career-header, .proj-entry, .edu-row, .proj-row { break-inside: avoid; }
      .highlight-list li { break-inside: avoid; }
    }
  </style>
</head>
