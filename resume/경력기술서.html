<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>임기창 경력기술서</title>
  <style>
    :root {
      --bg: #F2F2F0;
      --page: #FFFFFF;
      --t1: #0F0F0F;
      --t2: #4B5563;
      --t3: #9CA3AF;
      --accent-soft: #EEF2FF;
      --accent-text: #3730A3;
      --tag-bg: #FAFAF9;
      --tag-border: #D9D9D4;
      --border: #E5E7EB;
      --divider: #F3F4F6;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--t1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 820px;
      margin: 36px auto;
      background: var(--page);
      border-radius: 4px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    /* ── TYPE SCALE ──────────────────────────────
       11px meta/label · 12px secondary body · 13px base body
       14px sub-heading · 15px heading · 32px display        */

    /* ── HEADER ── */
    .header { padding: 40px 52px 32px; border-bottom: 1px solid var(--border); }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 28px; }
    .name { font-size: 32px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin-bottom: 4px; }
    .doc-type { font-size: 14px; color: var(--t2); }
    .contact { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 11px; color: var(--t2); flex-shrink: 0; }
    .contact a { color: var(--t2); text-decoration: none; }

    /* ── BODY ── */
    .body { padding: 0 52px 52px; }
    .section { padding-top: 28px; }
    .section-label {
      font-size: 11px; font-weight: 800;
      color: var(--t1);
      border-bottom: 1.5px solid var(--t1);
      padding-bottom: 6px;
      margin-bottom: 14px;
      letter-spacing: 0.01em;
    }

    /* ── SKILLS ── */
    .skills-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .skills-table td { padding: 8px 10px; border-bottom: 1px solid var(--divider); vertical-align: top; }
    .skills-table tr:last-child td { border-bottom: none; }
    .skills-table .sk-cat { font-size: 11px; font-weight: 600; color: var(--t2); white-space: nowrap; width: 100px; }
    .skills-table .sk-item { color: var(--t1); font-weight: 600; }
    .skills-table .sk-sep { color: var(--t3); font-weight: 400; }
    .cl { font-size: 11px; font-weight: 700; color: var(--t3); letter-spacing: 0.04em; margin-right: 5px; }

    /* ── COMPANY ── */
    .company-group { margin-top: 18px; }
    .company-group:first-child { margin-top: 0; }
    .company-block {
      margin-bottom: 14px;
      padding: 12px 16px;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      border-radius: 6px;
    }
    .company-header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    .company-name { font-size: 15px; font-weight: 800; }
    .company-period { font-size: 11px; color: var(--t3); white-space: nowrap; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .company-sub { font-size: 12px; color: var(--t2); margin-top: 2px; }

    /* ── PROJECT ── */
    .project { padding: 18px 0; }
    .project + .project { border-top: 1px solid var(--divider); }
    .project:first-of-type { margin-top: 14px; }
    .proj-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 10px; }
    .proj-title { font-size: 14px; font-weight: 700; }
    .proj-period { font-size: 11px; color: var(--t3); white-space: nowrap; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .proj-meta { font-size: 11px; color: var(--t3); margin-bottom: 8px; }
    .proj-stats { font-size: 11px; color: var(--t3); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
    .proj-summary { font-size: 13px; color: var(--t2); font-weight: 400; line-height: 1.75; margin-bottom: 14px; }

    /* ── SUB-SECTIONS ── */
    .sub-label {
      font-size: 11px; font-weight: 700;
      color: var(--t3); margin-bottom: 8px;
      letter-spacing: 0.03em;
    }
    .bullets { list-style: none; display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
    .bullets li { font-size: 12px; color: var(--t2); padding-left: 14px; position: relative; line-height: 1.65; }
    .bullets li::before { content:'–'; position: absolute; left: 0; color: var(--t3); }
    .bullets li strong { color: var(--accent-text); font-weight: 700; }

    /* ── OVERVIEW TABLE ── */
    .table-wrap { overflow-x: auto; }
    .overview-table { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 12px; }
    .overview-table th {
      text-align: left; font-size: 11px; font-weight: 700; color: var(--t3);
      letter-spacing: 0.02em; padding: 0 10px 8px; border-bottom: 1.5px solid var(--t1);
      white-space: nowrap; vertical-align: top;
    }
    .overview-table td { padding: 9px 10px; border-bottom: 1px solid var(--divider); color: var(--t2); vertical-align: top; }
    .overview-table tr:last-child td { border-bottom: none; }
    .overview-table .ov-title { font-weight: 700; color: var(--t1); white-space: nowrap; }
    .overview-table .ov-period, .overview-table .ov-contribution, .overview-table .ov-team { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .overview-table .ov-contribution { color: var(--accent-text); font-weight: 600; }
    .overview-table .ov-outcome { color: var(--t1); font-weight: 600; }

    /* ── PAAR (문제 해결 = 성과) ── */
    .paar-card { background: var(--accent-soft); border-radius: 6px; padding: 14px 16px; margin-bottom: 8px; }
    .paar-title { font-size: 13px; font-weight: 700; color: var(--t1); margin-bottom: 8px; }
    .paar-row { display: flex; gap: 8px; font-size: 12px; color: var(--t2); line-height: 1.6; margin-bottom: 6px; }
    .paar-row:last-child { margin-bottom: 0; }
    .paar-tag { font-weight: 800; color: var(--accent-text); flex-shrink: 0; width: 14px; }
    .paar-row strong { color: var(--accent-text); }

    /* ── EDU ── */
    .edu-list { display: flex; flex-direction: column; gap: 10px; }
    .edu-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    .edu-name { font-size: 13px; font-weight: 600; }
    .edu-detail { font-size: 12px; color: var(--t2); margin-top: 1px; }
    .edu-period { font-size: 11px; color: var(--t3); white-space: nowrap; flex-shrink: 0; font-variant-numeric: tabular-nums; }

    @page { size: A4; margin: 12mm 14mm; }
    @media print {
      html, body { background: #fff; }
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .page { margin: 0; border: none; border-radius: 0; box-shadow: none; max-width: 100%; overflow: visible; }
      .header { padding: 0 0 22px; }
      .body { padding: 0; }
      .section { padding-top: 20px; }
      .section-label, .sub-label, .proj-header { break-after: avoid; }
      .company-block, .paar-card, .edu-row, .bullets li { break-inside: avoid; }
    }
  </style>
</head>

function projectHtml(p) {
  const paarSection = p.paar.length > 0 ? `
    <div class="sub-label">문제 해결</div>
    ${p.paar.map(item => `
      <div class="paar-card">
        <div class="paar-title">${item.title}</div>
        <div class="paar-row"><span class="paar-tag">P</span><span>${item.p}</span></div>
        <div class="paar-row"><span class="paar-tag">A</span><span>${item.a1}</span></div>
        <div class="paar-row"><span class="paar-tag">A</span><span>${item.a2}</span></div>
        <div class="paar-row"><span class="paar-tag">R</span><span>${item.r}</span></div>
      </div>`).join('')}` : '';

  return `
    <div class="project">
      <div class="proj-header">
        <div class="proj-title">${p.title}</div>
        <span class="proj-period">${p.period}</span>
      </div>
      <div class="proj-meta">${p.tech.join(' · ')}</div>
      <div class="proj-stats">기여도 ${p.contribution}${p.team ? ` · 수행인원 ${p.team}` : ''}</div>
      <div class="proj-summary">${p.summary}</div>
      <div class="sub-label">담당 업무 및 성과</div>
      <ul class="bullets">
        ${p.tasks.map(t => `<li>${t}</li>`).join('')}
      </ul>
      ${paarSection}
    </div>`;
}

function render() {
  const D = DATA;
  document.title = `${D.name} 경력기술서`;

  const skillsHtml = D.skills.map(s => `
    <tr>
      <td class="sk-cat">${s.cat}</td>

    </tr>`
  ).join('');

  const overviewHtml = `
    <div class="table-wrap">
      <table class="overview-table">
        <thead>
          <tr><th>프로젝트</th><th>기간</th><th>기여도</th><th>수행인원</th><th>핵심 기술</th><th>핵심 성과</th></tr>

              <td class="ov-tech">${o.tech}</td>
              <td class="ov-outcome">${o.outcome}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

  const companiesHtml = D.companies.map(c => `

  const personalHtml = D.personal.map(projectHtml).join('');

  document.body.innerHTML = `
