<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>임기창 — 예상 면접 질문</title>
  <style>
    :root {
      --bg: #F2F2F0;
      --page: #FFFFFF;
      --t1: #0F0F0F;
      --t2: #4B5563;
      --t3: #9CA3AF;
      --accent: #3730A3;
      --accent-tint: #EEF2FF;
      --border: #E5E7EB;
      --warn-bg: #FFFBEB;
      --warn-line: #F59E0B;
      --fill-bg: #FEF2F2;
      --fill-line: #DC2626;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--t1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 880px;
      margin: 36px auto;
      background: var(--page);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .header { padding: 40px 52px 28px; border-bottom: 1.5px solid var(--t1); }
    .back { font-size: 12px; color: var(--t3); text-decoration: none; }
    .back:hover { color: var(--accent); }
    .name { font-size: 30px; font-weight: 800; letter-spacing: -0.035em; margin-top: 14px; }
    .doc-type { margin-top: 5px; font-size: 14px; color: var(--t2); }

    /* 이 문서는 제출용이 아니라는 걸 첫 화면에서 못 박는다 */
    .notice {
      margin-top: 20px; padding: 12px 16px;
      background: var(--warn-bg);
      border-left: 3px solid var(--warn-line);
      border-radius: 0 4px 4px 0;
      font-size: 12.5px; color: var(--t2); line-height: 1.65;
    }
    .notice b { color: var(--t1); }

    .toolbar { padding: 16px 52px 0; display: flex; gap: 8px; flex-wrap: wrap; }
    .toolbar button {
      font: inherit; font-size: 12px; font-weight: 600;
      padding: 6px 13px; border-radius: 4px; cursor: pointer;
      border: 1px solid var(--border); background: var(--page); color: var(--t2);
    }
    .toolbar button:hover { border-color: var(--accent); color: var(--accent); }

    .body { padding: 8px 52px 56px; }
    .sec { padding-top: 34px; }
    .sec-head {
      display: flex; align-items: baseline; gap: 10px;
      border-bottom: 1.5px solid var(--t1); padding-bottom: 7px; margin-bottom: 6px;
    }
    .sec-num { font-size: 11px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .sec-title { font-size: 12px; font-weight: 800; letter-spacing: 0.02em; }
    .sec-note { font-size: 11.5px; color: var(--t3); margin-bottom: 12px; }

    details {
      border-bottom: 1px solid var(--border);
      padding: 11px 0;
    }
    details[open] { padding-bottom: 16px; }
    summary {
      cursor: pointer; list-style: none;
      font-size: 13.5px; font-weight: 600; color: var(--t1);
      display: flex; gap: 9px; align-items: baseline;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before {
      content: '+'; color: var(--accent); font-weight: 800;
      flex-shrink: 0; width: 12px; font-size: 14px; line-height: 1.5;
    }
    details[open] > summary::before { content: '−'; }
    summary:hover { color: var(--accent); }

    .a { margin: 10px 0 0 21px; font-size: 13px; color: var(--t2); }
    .a p + p { margin-top: 8px; }
    .a b { color: var(--accent); font-weight: 700; }
    .a strong { color: var(--t1); font-weight: 600; }
    .a ul { list-style: none; margin-top: 7px; }
    .a li { padding-left: 14px; position: relative; margin-top: 4px; }
    .a li::before { content: '–'; position: absolute; left: 0; color: var(--t3); }

    /* 내 경험과 이어붙이는 대목 — 이게 있어야 교과서 답변과 갈린다 */
    .link {
      margin-top: 10px; padding: 9px 13px;
      background: var(--accent-tint);
      border-radius: 4px;
      font-size: 12.5px; color: var(--t2);
    }
    .link b { color: var(--accent); }

    /* 내가 채워야 하는 값 */
    .fill {
      margin-top: 10px; padding: 9px 13px;
      background: var(--fill-bg);
      border-left: 3px solid var(--fill-line);
      border-radius: 0 4px 4px 0;
      font-size: 12.5px; color: #7F1D1D;
    }
    .fill b { color: #991B1B; }

    @media (max-width: 720px) {
      .page { margin: 0; border: none; border-radius: 0; }
      .header { padding: 28px 22px 20px; }
      .toolbar { padding: 14px 22px 0; }
      .body { padding: 4px 22px 40px; }
      .a, .link, .fill { margin-left: 0; }
    }
    @page { size: A4; margin: 12mm 14mm; }
    @media print {
      body { background: #fff; }
      .page { margin: 0; border: none; box-shadow: none; max-width: 100%; }
      .toolbar { display: none; }
      details { break-inside: avoid; }
      details > .a, details > div { display: block !important; }
    }
  </style>
</head>
<body>

function render() {
  const D = DATA;
  document.title = `${D.name} — ${D.docType}`;

  const sectionsHtml = D.sections.map(s => `
    <div class="sec">
      <div class="sec-head">
        <span class="sec-num">${s.num}</span>
        <span class="sec-title">${s.title}</span>
      </div>
      <p class="sec-note">${s.note}</p>
      ${s.items.map(it => `
        <details>
          <summary>${it.q}</summary>
          <div class="a">${it.a}</div>
          ${it.link ? `<div class="link">${it.link}</div>` : ''}
          ${it.fill ? `<div class="fill">${it.fill}</div>` : ''}
        </details>
      `).join('')}
    </div>
  `).join('');

  const total = D.sections.reduce((n, s) => n + s.items.length, 0);

  document.body.innerHTML = `
    <div class="page">
      <div class="header">
        <a class="back" href="./">← 취업 서류로 돌아가기</a>
        <div class="name">${D.name}</div>
        <div class="doc-type">${D.docType} · 총 ${total}문항</div>
        <div class="notice">${D.notice}</div>
      </div>
      <div class="toolbar">
        <button id="openAll">모두 펼치기</button>
        <button id="closeAll">모두 접기</button>
      </div>
      <div class="body">${sectionsHtml}</div>
    </div>`;

  const all = () => document.querySelectorAll('details');
  document.getElementById('openAll').onclick  = () => all().forEach(d => d.open = true);
  document.getElementById('closeAll').onclick = () => all().forEach(d => d.open = false);
}
render();
</script>
