<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>임기창 면접 예상 질문 및 모범답안</title>
  <style>
    :root {
      --bg: #F2F2F0;
      --page: #FFFFFF;
      --t1: #0F0F0F;
      --t2: #4B5563;
      --t3: #9CA3AF;
      --accent: #3730A3;
      --accent-soft: #EEF2FF;
      --accent-text: #3730A3;
      --border: #E5E7EB;
      --divider: #F3F4F6;
      --q-bg: #3730A3;
      --a-bg: #F5F4F0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--t1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 860px;
      margin: 36px auto;
      background: var(--page);
      border-radius: 4px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .header { padding: 40px 52px 28px; border-bottom: 1px solid var(--border); }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .name { font-size: 2rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin-bottom: 4px; }
    .doc-type { font-size: 0.88rem; color: var(--t2); }
    .back-link { font-size: 11.5px; color: var(--t3); text-decoration: none; white-space: nowrap; }
    .back-link:hover { color: var(--accent); }
    /* TOC */
    .toc { padding: 20px 52px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; }
    .toc a {
      font-size: 11.5px; font-weight: 600; color: var(--accent-text);
      text-decoration: none;
      background: var(--accent-soft);
      padding: 6px 12px;
      border-radius: 999px;
    }
    .toc a:hover { background: #E0E4FF; }

    .body { padding: 8px 52px 52px; }
    .section { padding-top: 40px; }
    .section-label {
      font-size: 11px; font-weight: 800;
      color: var(--t1);
      border-bottom: 1.5px solid var(--t1);
      padding-bottom: 6px;
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }
    .section-desc { font-size: 12px; color: var(--t3); margin-bottom: 20px; }

    .qa-item { margin-bottom: 22px; }
    .qa-item:last-child { margin-bottom: 0; }
    .qa-q {
      display: flex; gap: 10px; align-items: flex-start;
      font-size: 13.5px; font-weight: 700; color: var(--t1);
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .qa-tag {
      flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px;
      border-radius: 5px;
      background: var(--q-bg); color: #fff;
      font-size: 10.5px; font-weight: 800;
      margin-top: 1px;
    }
    .qa-a { display: flex; gap: 10px; align-items: flex-start; }
    .qa-tag--a { background: #6B7280; }
    .qa-a-content {
      flex: 1;
      font-size: 12.5px; color: var(--t2); line-height: 1.85;
      background: var(--a-bg);
      border-radius: 6px;
      padding: 12px 16px;
    }
    .qa-a-content p + p { margin-top: 8px; }
    .qa-a-content strong { color: var(--t1); font-weight: 600; }
    .qa-a-content ul { list-style: none; margin-top: 6px; }
    .qa-a-content li { padding-left: 13px; position: relative; }
    .qa-a-content li::before { content:'–'; position: absolute; left: 0; color: var(--t3); }
    .qa-a-content li + li { margin-top: 4px; }
    .qa-note {
      font-size: 11.5px; color: var(--t3); font-style: italic;
      margin-top: 6px;
    }

    @media print {
      body { background: white; }
      .page { margin: 0; border: none; border-radius: 0; box-shadow: none; max-width: 100%; }
      .toc { display: none; }
      .qa-item { break-inside: avoid; }
    }
  </style>
</head>
<body>

function qnaHtml(item) {
  return `
    <div class="qa-item">
      <div class="qa-q"><span class="qa-tag">Q</span><span>${item.q}</span></div>
      <div class="qa-a">
        <span class="qa-tag qa-tag--a">A</span>
        <div>
          <div class="qa-a-content">${item.a}</div>
          ${item.note ? `<div class="qa-note">${item.note}</div>` : ''}
        </div>
      </div>
    </div>`;
}

function render() {
  const D = DATA;
  document.title = `${D.name} ${D.docType}`;

  const tocHtml = D.categories.map(c => `<a href="#${c.id}">${c.title}</a>`).join('');

  const sectionsHtml = D.categories.map(c => `
    <div class="section" id="${c.id}">
      <div class="section-label">${c.label} — ${c.title}</div>
      <div class="section-desc">${c.desc}</div>
      ${c.qna.map(qnaHtml).join('')}
    </div>
  `).join('');

  document.body.innerHTML = `
    <div class="page">
      <div class="header">
        <div class="header-top">
          <div>
            <div class="name">${D.name}</div>
            <div class="doc-type">${D.docType}</div>
          </div>
          <a href="../portfolio/" class="back-link">← 포트폴리오로 돌아가기</a>
        </div>
      </div>
      <div class="toc">${tocHtml}</div>
      <div class="body">${sectionsHtml}</div>
    </div>`;
}
render();
</script>
