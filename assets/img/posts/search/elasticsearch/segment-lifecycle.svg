<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 350" font-family="'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="922" height="342" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="465" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Elasticsearch 세그먼트 라이프사이클</text>

  <!-- Band A -->
  <text x="28" y="63" font-size="12.5" font-weight="700" fill="#475569">① 색인 → refresh(검색 가시성) → flush(영속성)</text>

  <rect x="24" y="80" width="140" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="94" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">색인 요청</text>
  <text x="94" y="124" text-anchor="middle" font-size="11" fill="#64748b">신규 문서</text>

  <line x1="168" y1="109" x2="226" y2="109" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="230" y="80" width="176" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="318" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">In-memory 버퍼</text>
  <text x="318" y="124" text-anchor="middle" font-size="11" fill="#64748b">+ Translog append</text>

  <text x="452" y="98" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">refresh · 1초</text>
  <line x1="410" y1="109" x2="494" y2="109" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="498" y="80" width="166" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="581" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">새 세그먼트</text>
  <text x="581" y="124" text-anchor="middle" font-size="11" fill="#3b82f6">검색 가능 (NRT)</text>

  <text x="710" y="98" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">flush · fsync</text>
  <line x1="668" y1="109" x2="752" y2="109" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="756" y="80" width="150" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="831" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">디스크 확정</text>
  <text x="831" y="124" text-anchor="middle" font-size="11" fill="#64748b">Translog 비움</text>

  <line x1="24" y1="178" x2="906" y2="178" stroke="#eef2f6" stroke-width="1.5"/>

  <!-- Band B -->
  <text x="28" y="208" font-size="12.5" font-weight="700" fill="#475569">② merge — 작은 세그먼트를 큰 세그먼트로 병합·정리</text>

  <rect x="40" y="228" width="60" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="70" y="259" text-anchor="middle" font-size="12" fill="#475569">seg</text>
  <rect x="112" y="228" width="60" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="142" y="259" text-anchor="middle" font-size="12" fill="#475569">seg</text>
  <rect x="184" y="228" width="60" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="214" y="259" text-anchor="middle" font-size="12" fill="#475569">seg</text>
  <rect x="256" y="228" width="60" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="286" y="259" text-anchor="middle" font-size="12" fill="#475569">seg</text>
  <text x="178" y="300" text-anchor="middle" font-size="11" fill="#94a3b8">작은 세그먼트 다수 (+ 삭제 표시 누적)</text>

  <text x="392" y="245" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">merge (백그라운드)</text>
  <line x1="330" y1="255" x2="466" y2="255" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="470" y="224" width="240" height="62" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="590" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">큰 세그먼트 1개</text>
  <text x="590" y="270" text-anchor="middle" font-size="11" fill="#059669">삭제 문서 물리 제거 · 파일 수 감소</text>
</svg>
